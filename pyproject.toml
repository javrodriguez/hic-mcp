[project]
name = "hic-mcp"
version = "0.1.0"
description = "MCP server for Hi-C / 3D-chromatin analysis: the open2c stack (cooler, cooltools) as agent tools over local .mcool/.cool files."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Javier Rodriguez Hernaez" }]
keywords = ["hi-c", "mcp", "3d-genome", "chromatin", "cooler", "cooltools", "model-context-protocol"]
dependencies = [
    "mcp>=2.1,<3",
    "cooler==0.10.4",
    "cooltools==0.7.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "bioframe>=0.7",
    "pydantic>=2.0",
]

[project.urls]
Repository = "https://github.com/javrodriguez/hic-mcp"

[project.scripts]
hic-mcp = "hic_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
